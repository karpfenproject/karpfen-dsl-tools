plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'java-library'
    id 'antlr'
    id 'maven-publish'
}

group = 'io.karpfen'
version = '2.0.0-SNAPSHOT'

def antlrVersion = '4.13.1'
def slf4jVersion = '2.0.20'
def projectUrl = 'https://github.com/karpfenproject/karpfen-dsl-tools'
def gitHubRepository = providers.environmentVariable('GITHUB_REPOSITORY')
        .orElse('karpfenproject/karpfen-dsl-tools')
def legacyArtifact = 'io.karpfen:karpfen-dsl-tools:1.0-SNAPSHOT'
def legacyJar = new File(
        providers.systemProperty('user.home').get(),
        '.m2/repository/io/karpfen/karpfen-dsl-tools/1.0-SNAPSHOT/karpfen-dsl-tools-1.0-SNAPSHOT.jar')

repositories {
    mavenCentral()
    mavenLocal {
        content {
            includeVersion 'io.karpfen', 'karpfen-dsl-tools', '1.0-SNAPSHOT'
        }
    }
}

dependencies {
    antlr "org.antlr:antlr4:$antlrVersion"
    api "org.antlr:antlr4-runtime:$antlrVersion"
    api 'org.json:json:20240303'
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testRuntimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
}

configurations.named('api') {
    def withoutAntlrTool = extendsFrom.findAll { it != configurations.antlr }
    setExtendsFrom(withoutAntlrTool)
}

kotlin {
    jvmToolchain(21)
}

java {
    withSourcesJar()
}

tasks.named('generateGrammarSource') {
    maxHeapSize = '64m'
    arguments += ['-visitor', '-no-listener']
}

sourceSets.configureEach { sourceSet ->
    def generatedGrammarSources = tasks.named(sourceSet.getTaskName('generate', 'GrammarSource')).map { it.outputDirectory }
    sourceSet.java.srcDirs = ["src/${sourceSet.name}/java", generatedGrammarSources]
}

sourceSets {
    compatibilityTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    compatibilityTestImplementation.extendsFrom testImplementation
    compatibilityTestRuntimeOnly.extendsFrom testRuntimeOnly
}

def legacyClasses = configurations.detachedConfiguration(dependencies.create(legacyArtifact))

dependencies {
    compatibilityTestImplementation files(legacyClasses)
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'budget'
    }
}

def compatibilityTest = tasks.register('compatibilityTest', Test) {
    description = "Compares the converters with those of version 1.0, ${legacyArtifact} from the local Maven repository."
    group = 'verification'
    testClassesDirs = sourceSets.compatibilityTest.output.classesDirs
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    jvmArgs '-XX:-OmitStackTraceInFastThrow'
    useJUnitPlatform {
        excludeTags 'budget'
    }
}

tasks.named('check') {
    if (legacyJar.exists()) {
        dependsOn compatibilityTest
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'karpfen-dsl-tools'
            from components.java
            pom {
                name = 'karpfen DSL tools'
                description = 'ANTLR grammars, parsers, semantic models and converters for the karpfen modeling languages KMeta, KModel and KStates.'
                url = projectUrl
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Karl Kegel'
                    }
                }
                scm {
                    url = projectUrl
                    connection = "scm:git:${projectUrl}.git"
                    developerConnection = 'scm:git:ssh://git@github.com/karpfenproject/karpfen-dsl-tools.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${gitHubRepository.get()}")
            credentials {
                username = providers.environmentVariable('GITHUB_ACTOR').orNull
                password = providers.environmentVariable('GITHUB_TOKEN').orNull
            }
        }
    }
}

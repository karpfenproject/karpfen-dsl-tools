plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'java-library'
    id 'antlr'
    id 'maven-publish'
}

group = 'io.karpfen'
version = '2.0.0-SNAPSHOT'

/**
 * The versions of the libraries, which the build of version 1.0 for the compatibility tests uses too.
 */
ext {
    antlrVersion = '4.13.1'
    jsonVersion = '20240303'
    slf4jVersion = '2.0.20'
}

def projectUrl = 'https://github.com/karpfenproject/karpfen-dsl-tools'
def gitHubRepository = providers.environmentVariable('GITHUB_REPOSITORY')
        .orElse('karpfenproject/karpfen-dsl-tools')

repositories {
    mavenCentral()
}

/**
 * The ANTLR tool only generates the parsers during the build. The runtime is part of the API, because the generated
 * lexers and parsers are public, and so are `org.json`, which `JsonToModelConverter` accepts, and the SLF4J API,
 * whose `Logger` `LoggingSyntaxErrorListener` takes. The library ships no logging backend; the tests log through
 * slf4j-simple.
 */
dependencies {
    antlr "org.antlr:antlr4:$antlrVersion"
    api "org.antlr:antlr4-runtime:$antlrVersion"
    api "org.json:json:$jsonVersion"
    api "org.slf4j:slf4j-api:$slf4jVersion"
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testRuntimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
}

/**
 * The ANTLR plugin puts the ANTLR tool on the `api` configuration, which would make every consumer depend on it;
 * the tool stays inside the build.
 */
configurations.named('api') {
    def withoutAntlrTool = extendsFrom.findAll { it != configurations.antlr }
    setExtendsFrom(withoutAntlrTool)
}

kotlin {
    jvmToolchain(21)
}

java {
    withSourcesJar()
}

/**
 * The lexers and parsers are generated with visitors and without listeners; the package of each grammar comes from
 * the `@header` of its `.g4` file in `src/main/antlr`.
 */
tasks.named('generateGrammarSource') {
    maxHeapSize = '64m'
    arguments += ['-visitor', '-no-listener']
}

/**
 * Every source set compiles the parsers generated from its grammars next to its own Java sources. The generated
 * directory is given as the output of the generation task, so that every task that reads the Java sources, the
 * Kotlin compilation among them, runs after the generation.
 */
sourceSets.configureEach { sourceSet ->
    def generatedGrammarSources = tasks.named(sourceSet.getTaskName('generate', 'GrammarSource')).map { it.outputDirectory }
    sourceSet.java.srcDirs = ["src/${sourceSet.name}/java", generatedGrammarSources]
}

/**
 * Time-budget tests are tagged `budget` and never run, here or in the compatibility tests.
 */
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'budget'
    }
}

/**
 * The files of the project folder that the tests read from disk rather than from their classpath: the example
 * documents, and every Kotlin source, Gradle script, grammar, markdown document and CI workflow, whose license
 * headers, comments and wording the convention tests check, wherever it stands. The build output, the output folders
 * that git ignores and the hidden folders are left out, except for the folder of the CI workflows.
 */
def filesTheTestsRead = files(
        'example',
        fileTree('.') {
            include '**/*.kt', '**/*.kts', '**/*.gradle', '**/*.g4', '**/*.md', '**/*.kmeta', '**/*.kmodel', '**/*.kstates'
            exclude 'build/**', 'bin/**', '**/.*/**'
        },
        fileTree('.github') { include 'workflows/*.yml' }
)

/**
 * Hands the files the tests read from disk to a test task, as its inputs and as the system property
 * `karpfen.dsl.filesTheTestsRead`: their paths relative to the project folder, with '/' separators, joined by the
 * path separator of the platform. A change of one of the files runs the tests again instead of taking their results
 * as up to date or from the build cache, and the convention tests check exactly these files, so that what they check
 * and what the build declares cannot differ.
 */
abstract class FilesTheTestsRead implements CommandLineArgumentProvider {

    /** The files the tests read. */
    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getFiles()

    /** The project folder, which the paths are relative to. */
    @Internal
    abstract DirectoryProperty getProjectFolder()

    /**
     * Returns the system property with the paths of the files.
     */
    @Override
    Iterable<String> asArguments() {
        def folder = projectFolder.get().asFile.toPath()
        def paths = files.files.collect { folder.relativize(it.toPath()).toString().replace(File.separator, '/') }
        return ["-Dkarpfen.dsl.filesTheTestsRead=${paths.sort().join(File.pathSeparator)}".toString()]
    }
}

/**
 * Every test task reads the files the tests read through [FilesTheTestsRead].
 */
tasks.withType(Test).configureEach {
    def filesProvider = objects.newInstance(FilesTheTestsRead)
    filesProvider.files.from(filesTheTestsRead)
    filesProvider.projectFolder = layout.projectDirectory
    jvmArgumentProviders.add(filesProvider)
}

/**
 * The comparison of the converters with those of version 1.0, in the task `compatibilityTest`.
 */
apply from: 'gradle/compatibility-test.gradle'

/**
 * The publication of the library jar, its sources jar and its POM, to the local Maven repository with
 * `publishToMavenLocal`, or to GitHub Packages with `publish`. The repository on GitHub Packages comes from the
 * environment variable `GITHUB_REPOSITORY`, as GitHub Actions sets it, and the credentials from the Gradle
 * properties `GitHubPackagesUsername` and `GitHubPackagesPassword`, which Gradle reads lazily, so that publishing
 * keeps the configuration cache.
 */
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'karpfen-dsl-tools'
            from components.java
            pom {
                name = 'karpfen DSL tools'
                description = 'ANTLR grammars, parsers, semantic models and converters for the karpfen modeling languages KMeta, KModel and KStates.'
                url = projectUrl
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Karl Kegel'
                    }
                }
                scm {
                    url = projectUrl
                    connection = "scm:git:${projectUrl}.git"
                    developerConnection = 'scm:git:ssh://git@github.com/karpfenproject/karpfen-dsl-tools.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${gitHubRepository.get()}")
            credentials(PasswordCredentials)
        }
    }
}

/**
 * The check of the dependencies the publication declares, in the task `checkPublishedDependencies`.
 */
apply from: 'gradle/published-dependencies.gradle'

/**
 * True in the build of this repository itself, false in a build that includes it as a subproject, as karpfen-runtime
 * does, or as an included build, as the karpfen IDE does. Those builds only consume the library.
 */
def isOwnBuild = project == rootProject && gradle.parent == null

/**
 * The checks of what this repository delivers beyond its tests, `compatibilityTest` and `checkPublishedDependencies`,
 * are part of `check`, and so of `build`, only in the build of this repository itself. In the builds that consume
 * the library, `check` runs its tests, and the comparison with version 1.0 would need git and the full history of
 * this repository.
 */
if (isOwnBuild) {
    tasks.named('check') {
        dependsOn 'compatibilityTest', 'checkPublishedDependencies'
    }
}

/**
 * In the build of this repository itself, a warning of the Kotlin compiler fails the compilation of the sources, the
 * tests and the compatibility tests, so that a new warning cannot go unnoticed among others. The builds that consume
 * the library may compile it with another version of Kotlin, whose new warnings must not break them.
 */
if (isOwnBuild) {
    ['compileKotlin', 'compileTestKotlin', 'compileCompatibilityTestKotlin'].each { compilation ->
        tasks.named(compilation) {
            compilerOptions {
                allWarningsAsErrors = true
            }
        }
    }
}

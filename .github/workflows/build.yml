name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on JDK 21
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources with their full history, which holds version 1.0 for the compatibility tests
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle, caching the Gradle user home with the MIT-licensed actions/cache as the karpfen IDE does
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Configure publishing without publishing, so that a configuration cache problem in it fails the build
        run: ./gradlew publish --dry-run --console=plain
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: dry-run
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: dry-run

      - name: Build as a subproject of another build, as karpfen-runtime does, which neither runs nor needs the compatibility tests
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          printf "include 'karpfen-dsl-tools'\nproject(':karpfen-dsl-tools').projectDir = file('%s')\n" "$GITHUB_WORKSPACE" > "$consumer/settings.gradle"
          ./gradlew -p "$consumer" build --dry-run --console=plain | tee "$consumer/tasks.txt"
          grep -q ':karpfen-dsl-tools:test ' "$consumer/tasks.txt"
          ! grep -q -e compatibilityTest -e archiveReferenceSources "$consumer/tasks.txt"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

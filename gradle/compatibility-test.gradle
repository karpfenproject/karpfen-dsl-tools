import javax.inject.Inject

/**
 * The commit of version 1.0 in the history of this repository, by its full hash: the upstream main that karpfen-runtime
 * pins, whose converters the compatibility tests hold the current ones to. Version 1.0 committed the parsers ANTLR
 * generated for it, in the root packages `kmeta`, `kmodel` and `kstates`, next to its Kotlin sources.
 */
def referenceCommit = '859a95da0541e6c403994d22d38f8c8510720324'

/**
 * Writes the Kotlin sources and the generated parsers of version 1.0 from the history of the git repository that
 * holds the project folder into a tar archive, with git.
 *
 * A failure says why the commit cannot be read and what helps: the project folder belongs to no git repository, the
 * repository is a shallow clone without the commit, or it does not hold the commit at all, as when the sources were
 * copied into another repository.
 */
abstract class ArchiveReferenceSources extends DefaultTask {

    /** The full hash of the commit of version 1.0. */
    @Input
    abstract Property<String> getCommit()

    /** The folders to archive, relative to the project folder. */
    @Input
    abstract ListProperty<String> getPaths()

    /** The project folder, in the git repository whose history holds the commit. */
    @Internal
    abstract DirectoryProperty getProjectFolder()

    /** The tar archive to write. */
    @OutputFile
    abstract RegularFileProperty getArchive()

    /** Runs git. */
    @Inject
    abstract ExecOperations getExecOperations()

    /**
     * Writes the archive, after checking that git can read the commit.
     */
    @TaskAction
    void writeArchive() {
        def hash = commit.get()
        if (git(['rev-parse', '--git-dir']).exitValue != 0) {
            throw new GradleException("The folder ${projectFolder.get().asFile} is not part of a git repository, so " +
                    "the compatibility tests cannot build version 1.0, commit ${hash}, from its history. Run them " +
                    'in a clone of karpfen-dsl-tools with its full history.')
        }
        if (git(['cat-file', '-e', "${hash}^{commit}".toString()]).exitValue != 0) {
            throw new GradleException(missingCommitMessage(hash))
        }
        def archived = git(['archive', '--format=tar', "--output=${archive.get().asFile.absolutePath}".toString(), hash] +
                paths.get())
        if (archived.exitValue != 0) {
            throw new GradleException("git could not archive version 1.0, commit ${hash}: ${archived.errors}")
        }
    }

    /**
     * Returns why the repository of the project folder lacks the commit [hash] and what helps.
     */
    private String missingCommitMessage(String hash) {
        def repository = git(['rev-parse', '--show-toplevel']).output
        if (git(['rev-parse', '--is-shallow-repository']).output == 'true') {
            return "The git repository at ${repository} is a shallow clone without the commit ${hash} of version " +
                    '1.0, which the compatibility tests build from the history. Fetch the full history, for example ' +
                    "with 'git fetch --unshallow', or check the repository out with 'fetch-depth: 0' in GitHub Actions."
        }
        return "The git repository at ${repository} does not hold the commit ${hash} of version 1.0, which the " +
                'compatibility tests build from the history; the sources were perhaps copied into another ' +
                'repository. Run the compatibility tests in a clone of karpfen-dsl-tools with its full history.'
    }

    /**
     * Runs git with [arguments] in the project folder and returns its exit value, its output and its error output,
     * trimmed.
     */
    private Map<String, Object> git(List<String> arguments) {
        def output = new ByteArrayOutputStream()
        def errors = new ByteArrayOutputStream()
        def result
        try {
            result = execOperations.exec { spec ->
                spec.commandLine(['git'] + arguments)
                spec.workingDir(projectFolder.get().asFile)
                spec.ignoreExitValue = true
                spec.standardOutput = output
                spec.errorOutput = errors
            }
        } catch (GradleException notStarted) {
            throw new GradleException('git could not be run, but the compatibility tests build version 1.0 from ' +
                    "the history of this repository with git: ${notStarted.message}", notStarted)
        }
        return [exitValue: result.exitValue, output: output.toString().trim(), errors: errors.toString().trim()]
    }
}

/**
 * Archives the sources of version 1.0 from the history of this repository.
 */
def archiveReferenceSources = tasks.register('archiveReferenceSources', ArchiveReferenceSources) {
    description = "Archives the sources of version 1.0, commit ${referenceCommit}, from the history of this repository."
    commit = referenceCommit
    paths = ['src/main/kotlin', 'src/main/java']
    projectFolder = layout.projectDirectory
    archive = layout.buildDirectory.file('reference/sources.tar')
}

/**
 * Unpacks the sources of version 1.0, the input of the `reference` source set.
 */
def unpackReferenceSources = tasks.register('unpackReferenceSources', Sync) {
    description = 'Unpacks the sources of version 1.0 for the reference source set.'
    dependsOn archiveReferenceSources
    from(tarTree(layout.buildDirectory.file('reference/sources.tar')))
    into(layout.buildDirectory.dir('reference/sources'))
}

/**
 * Two source sets beyond `main` and `test`: `reference` compiles version 1.0 from the unpacked sources, with the
 * libraries it was built with, and `compatibilityTest` compares the converters of both versions. The classes of
 * version 1.0 live in their old root packages, so both versions share one classpath; no module coordinate names
 * version 1.0, so no dependency substitution of a composite build can replace it. The Kotlin compilation of
 * `reference` reads the generated parsers of version 1.0 from its own source directories, because it does not follow
 * a Java source directory that is set after the source set was created.
 */
sourceSets {
    reference { sourceSet ->
        sourceSet.java.srcDirs = [unpackReferenceSources.map { new File(it.destinationDir, 'src/main/java') }]
    }
    compatibilityTest { sourceSet ->
        sourceSet.compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.reference.output
        sourceSet.runtimeClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.reference.output
    }
}

/**
 * The Kotlin sources of version 1.0, next to its generated parsers.
 */
kotlin.sourceSets.named('reference') { sourceSet ->
    sourceSet.kotlin.srcDirs = ['src/main/kotlin', 'src/main/java'].collect { directory ->
        unpackReferenceSources.map { new File(it.destinationDir, directory) }
    }
}

/**
 * The sources of version 1.0 are frozen, so the warnings of their compiler concern nobody who can act on them, and
 * they are not printed.
 */
tasks.named('compileReferenceKotlin') {
    compilerOptions {
        suppressWarnings = true
    }
}

/**
 * The compatibility tests use the test libraries and the fixtures of the tests.
 */
configurations {
    compatibilityTestImplementation.extendsFrom testImplementation
    compatibilityTestRuntimeOnly.extendsFrom testRuntimeOnly
}

/**
 * The libraries version 1.0 was built with.
 */
dependencies {
    referenceImplementation "org.antlr:antlr4-runtime:${antlrVersion}"
    referenceImplementation "org.json:json:${jsonVersion}"
    referenceImplementation 'org.jetbrains.kotlin:kotlin-stdlib'
}

/**
 * Compares the converters with those of version 1.0, see the `reference` source set. Many of the exceptions both
 * versions must agree on are null pointer exceptions the JVM raises itself, whose messages it drops once the
 * throwing code is compiled as hot, unless `OmitStackTraceInFastThrow` is off.
 */
tasks.register('compatibilityTest', Test) {
    description = "Compares the converters with those of version 1.0, built from commit ${referenceCommit}."
    group = 'verification'
    testClassesDirs = sourceSets.compatibilityTest.output.classesDirs
    classpath = sourceSets.compatibilityTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    jvmArgs '-XX:-OmitStackTraceInFastThrow'
    useJUnitPlatform {
        excludeTags 'budget'
    }
}
